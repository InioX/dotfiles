theme = "matugen"

[editor]
bufferline = "multiple"
auto-format = true
popup-border = "all"

[editor.statusline]
center = ["position-percentage"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
diagnostics = ["warning", "error"]
workspace-diagnostics = ["warning", "error"]

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[keys.normal]
C-f = ":format"
C-g = [
    ":write-all", 
    ":new", 
    ":insert-output lazygit", 
    ":buffer-close!", 
    ":redraw", 
    ":reload-all"
]
esc = ["collapse_selection", "keep_primary_selection"]
C-s = ":w"

[keys.normal.space]
x = ":buffer-close"
